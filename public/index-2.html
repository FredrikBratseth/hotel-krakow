<style>
/* Layout: one-screen arcade cabinet — HUD strip, top-down camera view with radar, control deck */
:root{
  --bg:#0b0a14; --panel:#16131f; --line:#2d2639; --fg:#f1e7d0; --dim:#9b8fa8;
  --amber:#ffb238; --red:#ff5047; --green:#62d48c;
  --pixel:'Press Start 2P', ui-monospace, Menlo, monospace;
  --body:'VT323', ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}

.hud{display:flex;flex-direction:column;gap:6px}
.hud .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{display:flex;flex-direction:column;gap:3px}
.stat.mid{align-items:center}.stat.right{align-items:flex-end}
.lbl{font-family:var(--pixel);font-size:8px;letter-spacing:.12em;color:var(--dim)}
.val{font-family:var(--pixel);font-size:14px;color:var(--amber);font-variant-numeric:tabular-nums}
#score{color:var(--fg)}
.meter{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:10px;background:#1d1828;border:2px solid var(--line);overflow:hidden}
#uro{height:100%;width:0;background:var(--green)}
.meter.warn .lbl{color:var(--red);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.floors{display:flex;gap:6px}
.chip{flex:1;font-family:var(--pixel);font-size:8px;padding:5px 6px;border:2px solid var(--line);color:var(--dim);
  display:flex;justify-content:space-between;align-items:center;gap:4px;min-width:0}
.chip.on{border-color:var(--amber);color:var(--amber)}
.chip.alert{background:#4a141c;color:#ffd0c8}
.chip b{font-weight:400;color:var(--fg)}
.chip.done{opacity:.45}
.chip.mini{justify-content:center}

#stage{flex:1;min-height:0;position:relative;border:3px solid var(--line);box-shadow:0 0 0 3px #000;overflow:hidden;touch-action:none;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#mm{position:absolute;top:8px;right:8px;width:96px;height:85px;border:2px solid rgba(255,178,56,.7);background:rgba(10,8,16,.75);image-rendering:pixelated}
#fstick{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.06);pointer-events:none}
#fstick i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,178,56,.55)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;overflow:auto}
.card{background:rgba(11,10,20,.94);border:3px solid var(--amber);box-shadow:6px 6px 0 #000;padding:18px 16px;max-width:340px;
  display:flex;flex-direction:column;gap:11px;text-align:center;margin:auto}
.card h1{font-family:var(--pixel);font-size:26px;line-height:1.2;margin:0;color:var(--amber);text-shadow:3px 3px 0 #7a2416}
.card h2{font-family:var(--pixel);font-size:14px;margin:0;color:var(--amber);line-height:1.4;text-wrap:balance}
.card .sub{font-family:var(--pixel);font-size:8px;color:var(--dim);letter-spacing:.1em;line-height:1.6}
.card p{margin:0;font-size:20px;line-height:1.12;color:var(--fg);text-align:left}
.card p em{font-style:normal;color:var(--amber)}
.legend{display:flex;justify-content:center;gap:12px;font-family:var(--pixel);font-size:8px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:8px;height:8px}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:20px;text-align:left}
.stats span:nth-child(even){color:var(--amber);font-variant-numeric:tabular-nums;text-align:right}
.btn{font-family:var(--pixel);font-size:12px;padding:14px 12px;background:var(--amber);color:#1b0f02;border:0;box-shadow:0 4px 0 #8a4f00;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4f00}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#toast{position:absolute;left:0;right:110px;top:8px;text-align:center;pointer-events:none;font-family:var(--pixel);font-size:8px;line-height:1.5;
  color:var(--fg);text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .25s;padding:0 8px}
#toast.show{opacity:1}

.deck{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:4px;touch-action:none}
#stick{position:relative;width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,#1f1a2b 0 55%,#15121e 56%);
  border:3px solid var(--line);box-shadow:0 4px 0 #000;touch-action:none;flex:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ffcf7a,#d98a12);box-shadow:0 3px 0 #6b3d00;pointer-events:none}
#stick::after{content:"";position:absolute;inset:10px;border-radius:50%;border:2px dashed #2d2639;pointer-events:none}
.btns{display:flex;align-items:center;gap:12px}
.rb{width:82px;height:82px;border-radius:50%;cursor:pointer;font-family:var(--pixel);font-size:8px;line-height:1.5;color:#fff;
  box-shadow:0 4px 0 #000;touch-action:none;position:relative}
.rb:active,.rb.held{transform:translateY(3px);box-shadow:0 1px 0 #000}
#whistle{--cd:0;border:3px solid var(--amber);background:conic-gradient(rgba(0,0,0,.65) calc(var(--cd)*1turn),transparent 0),#c8312b}
#whistle[disabled]{border-color:var(--line);color:#d8b0b0}
#sprint{--st:1;border:3px solid #5fb0ff;background:linear-gradient(to top,#2a6fc0 calc(var(--st)*100%),#1a2234 0)}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
#menu{background:none;border:2px solid var(--amber);color:var(--amber);font-family:var(--pixel);font-size:7px;padding:5px 7px;cursor:pointer;margin-bottom:6px}
body.intro .hud,body.intro .deck{display:none!important}
body.intro #overlay{padding:6px}
body.intro .card{max-width:520px;width:100%;padding:14px 14px;gap:9px}
@media (max-height:740px){body.intro .card p{font-size:18px}body.intro .card .note{font-size:14.5px}body.intro .card h1{font-size:22px}body.intro .btn{padding:11px 10px}}
@media (max-height:690px){body.intro .card{gap:6px;padding:10px 12px}body.intro .card p{font-size:16.5px;line-height:1.05}body.intro .card .note{font-size:13.5px}body.intro .card h1{font-size:19px}body.intro .nick input{font-size:18px;padding:5px 8px}body.intro .codein{font-size:17px;padding:4px 6px}body.intro .btn{padding:9px 8px;font-size:11px}}
#menuBox{position:fixed;inset:0;z-index:50;background:rgba(5,4,12,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#menuBox[hidden]{display:none}
#menuBox .mb{background:var(--panel);border:3px solid var(--amber);padding:18px 16px;display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
#menuBox .mb.wide{width:min(440px,100%);max-height:84vh;overflow:auto;gap:8px}
#menuBox h3{font-family:var(--pixel);font-size:9px;color:var(--amber);margin:12px 0 2px;letter-spacing:.08em}
#menuBox .set p,#menuBox .set li{font-family:'VT323',monospace;font-size:19px;line-height:1.25;color:var(--fg);margin:0}
#menuBox .set ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
#menuBox .set em{color:var(--amber);font-style:normal}
#menuBox h2{font-family:var(--pixel);font-size:11px;color:var(--amber);margin:0 0 4px;text-align:center}
#mute{background:none;border:2px solid var(--line);color:var(--dim);font-family:var(--pixel);font-size:7px;padding:5px 7px;cursor:pointer}
.nick{display:flex;flex-direction:column;gap:5px;text-align:left}
.nick span{font-family:var(--pixel);font-size:8px;color:var(--dim);letter-spacing:.1em}
.nick input{font-family:var(--body);font-size:22px;padding:8px 10px;background:#1d1828;color:var(--fg);border:2px solid var(--line);outline:none}
.nick input:focus{border-color:var(--amber)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.alt{background:var(--panel);color:var(--amber);border:2px solid var(--amber);box-shadow:0 4px 0 #000;font-size:9px;padding:11px 6px}
.tabs{display:flex;gap:4px}
.tab{flex:1;font-family:var(--pixel);font-size:7px;padding:8px 2px;background:none;border:2px solid var(--line);color:var(--dim);cursor:pointer}
.tab.on{border-color:var(--amber);color:var(--amber)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.board li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;font-size:20px;padding:3px 6px;background:#17131f}
.board li span:first-child{color:var(--dim);font-variant-numeric:tabular-nums}
.board li span:last-child{color:var(--amber);font-variant-numeric:tabular-nums}
.board li span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li small{font-size:14px;color:var(--dim)}
.board li.me{background:#3a2a12}
[hidden]{display:none!important}
#skip{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;z-index:5;font-family:var(--pixel);font-size:10px;padding:12px 14px;background:var(--amber);color:#1b0f02;border:0;box-shadow:0 4px 0 #8a4f00;cursor:pointer}
#skip:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4f00}
#banner{position:absolute;left:8px;right:112px;bottom:8px;background:rgba(11,10,20,.88);border:2px solid var(--amber);padding:8px 10px;
  font-family:var(--pixel);font-size:8px;line-height:1.7;color:var(--fg);display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#banner b{color:var(--amber);font-weight:400}
#banner button{align-self:flex-start;font-family:var(--pixel);font-size:8px;background:var(--amber);color:#1b0f02;border:0;padding:7px 9px;cursor:pointer}
.code{font-family:var(--pixel);font-size:30px;color:var(--amber);letter-spacing:.2em;text-shadow:3px 3px 0 #7a2416}
.plist{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.plist span{font-size:18px;background:#1d1828;border:1px solid var(--line);padding:1px 6px}
.plist span.t{border-color:var(--red);color:#ffb0a8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.row2 label{min-width:0;display:flex;flex-direction:column;gap:4px;font-family:var(--pixel);font-size:7px;color:var(--dim)}
.row2 select{width:100%;min-width:0}
.row2 select,.codein{font-family:var(--body);font-size:20px;padding:6px 8px;background:#1d1828;color:var(--fg);border:2px solid var(--line)}
.chk{display:flex;gap:8px;align-items:center;font-size:19px;text-align:left}
.card .note{font-size:16px;color:var(--dim);text-align:left;margin:0}
@media (max-height:660px){#stick{width:104px;height:104px}#stick i{width:44px;height:44px;margin:-22px 0 0 -22px}.rb{width:68px;height:68px}}
@media (prefers-reduced-motion:reduce){.meter.warn .lbl{animation:none}}
</style>

<div id="app">
  <header class="hud">
    <div class="row">
      <div class="stat"><span class="lbl" id="lblL">KLOKKA</span><span id="clock" class="val">23:00</span></div>
      <div class="stat mid"><span class="lbl">POENG</span><span id="score" class="val">0</span></div>
      <div class="stat right"><span class="lbl" id="lblR">ETASJE</span><span id="floorLbl" class="val">1</span></div>
    </div>
    <div class="meter" id="meter"><span class="lbl" id="lblM">URO</span><div class="bar"><div id="uro"></div></div></div>
    <div class="floors" id="floors"></div>
  </header>

  <main id="stage">
    <canvas id="cv" aria-label="Hotellet sett ovenfra"></canvas>
    <canvas id="mm" aria-label="Minikart"></canvas>
    <div id="fstick" hidden><i></i></div>
    <div id="toast"></div>
    <div id="banner" hidden></div>
    <button id="skip" hidden>HOPP OVER ▶</button>
    <div id="overlay"></div>
  </main>

  <footer class="deck">
    <div id="stick" aria-label="Styrespak"><i id="knob"></i></div>
    <div class="btns">
      <button class="rb" id="sprint" aria-label="Spurt">SPURT</button>
      <div class="col">
        <button class="rb" id="whistle" aria-label="Blås i fløyta">FLØYTE</button>
        <button id="menu" hidden>☰ MENY</button>
        <button id="mute">LYD PÅ</button>
      </div>
    </div>
  </footer>
</div>

<script>
(()=>{
// ================= MAPS =================
const MAP=[
"#############################################",
"#aaaaa#bbbbb#ccccc#ddddd#eeeee#fffff#^^^#####",
"#aaaaa#bbbbb#ccccc#ddddd#eeeee#fffff#^^^#####",

"#..=~~~~#pppppp#ooooooooo#pppppp,pppp#..#:::r",
"#..#~~~~=pppppp#ooooooooo#pppppp#pppp,..#:::r",
"#..#~~~~#pppppp#ooooooooo#pppppp#pppp#..#:::r",
"#..######ppppppooooooooooopppppp######..#:::r",
"#..######ppppppooooooooooopppppp######..#:::r",
"#..######ppppppooooooooooopppppp######..#:::r",
"#..#;;;;#pppppp#ooooooooo#pppppp#~~~~#..#:::r",
"#..,;;;;#pppppp#ooooooooo#pppppp=~~~~#..#:::r",
"#..#;;;;,pppppp#ooooooooo#pppppp#~~~~=..%:::r",
"#..#;;;;#pppppp#ooooooooo#pppppp#~~~~#..#:::r",
"#..######pppppp####ooo####pppppp######..#:::r",
"#.......................................#:::r",
"#.......................................#:::r",
"#...###G#####H#####I#####J#####K#####L#######",
"#vvv#ggggg#hhhhh,iiiii#jjjjj#kkkkk,lllll#####",
"#vvv#ggggg#hhhhh#iiiii#jjjjj#kkkkk#lllll#####",
"#vvv#ggggg#hhhhh#iiiii#jjjjj#kkkkk#lllll#####",
"#############################################"];
const LOBBY=(()=>{const r=['#'.repeat(27)];
  for(let y=1;y<=3;y++)r.push('#'+'o'.repeat(21)+'#^^^#');
  r.push('#'+'o'.repeat(25)+'#');
  for(let y=5;y<=22;y++)r.push('#'+'o'.repeat(11)+'...'+'o'.repeat(11)+'#');
  r.push('#'.repeat(12)+'XXX'+'#'.repeat(12));return r})();
const W=45,H=27,TS=24,CS=2,NIGHT=240;
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const DANG={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2};
const WALKCH='.~:=%op,;abcdefghijklABCDEFGHIJKL';
const isRoomCh=c=>c>='a'&&c<='n';
const isDoorCh=c=>c>='A'&&c<='N';
const SPIRAL_UP=[38.5,2.5],SPIRAL_DN=[2.5,24.5];

// ================= FURNITURE =================
const F_BALC=[{t:'bench',x:19.2,y:8.1,w:2.6,h:.75},{t:'pot',x:22.15,y:11.15,w:.7,h:.7},{t:'pot',x:18.15,y:11.15,w:.7,h:.7}];
const PLANTS4=[{t:'plant',x:8.1,y:7.1,w:.8,h:.8},{t:'plant',x:16.1,y:7.1,w:.8,h:.8},{t:'plant',x:8.1,y:16.1,w:.8,h:.8},{t:'plant',x:16.1,y:16.1,w:.8,h:.8}];
const F_LOUNGE=[...PLANTS4,{t:'sofa',x:9.3,y:8.2,w:2.8,h:.95},{t:'table',x:9.8,y:9.6,w:1.8,h:1},{t:'sofa',x:9.3,y:11,w:2.8,h:.95,flip:1},
 {t:'piano',x:13.6,y:8.2,w:2.2,h:1.5},{t:'chair',x:14.1,y:10.1,w:.8,h:.8},{t:'pool',x:11.6,y:13.2,w:2.8,h:1.6}];
const F_RECEP=[...PLANTS4,{t:'keys',x:9.9,y:7.04,w:5.2,h:.42,tall:1},{t:'desk',x:9.4,y:8.15,w:6.2,h:1.05},
 {t:'pillar',x:8.2,y:11.6,w:.8,h:.8,tall:1},{t:'pillar',x:16,y:11.6,w:.8,h:.8,tall:1},
 {t:'chair',x:10.2,y:12.95,w:.85,h:.85},{t:'table',x:11.3,y:13.02,w:1.4,h:.72},{t:'chair',x:12.95,y:12.95,w:.85,h:.85},
 {t:'trolley',x:14.9,y:13.2,w:.9,h:1.3}];
const F_LOBBY=[{t:'keys',x:9.2,y:1.02,w:7.6,h:.38,tall:1},{t:'desk',x:8.3,y:2.7,w:9.4,h:1.05},
 {t:'clock',x:1.15,y:1.1,w:.7,h:.75,tall:1},{t:'plant',x:7.1,y:2.8,w:.8,h:.8},{t:'plant',x:18.1,y:2.8,w:.8,h:.8},
 {t:'sofa',x:8.4,y:9.9,w:2.4,h:.9},{t:'sofa',x:15.2,y:9.9,w:2.4,h:.9},
 {t:'plant',x:10.1,y:20.6,w:.8,h:.8},{t:'plant',x:16.1,y:20.6,w:.8,h:.8},{t:'plant',x:1.1,y:21.1,w:.8,h:.8},{t:'plant',x:25.1,y:21.1,w:.8,h:.8},
 {t:'trolley',x:19.2,y:19.4,w:.9,h:1.3}];
[5,20].forEach(c=>[7,12,17].forEach(r=>F_LOBBY.push({t:'pillar',x:c+.1,y:r+.1,w:.8,h:.8,tall:1})));
[[2.6,9.6],[2.6,14.6],[22.4,9.6],[22.4,14.6]].forEach(([cx,cy])=>F_LOBBY.push({t:'table',x:cx-.5,y:cy-.35,w:1,h:.7},{t:'chair',x:cx-1.45,y:cy-.42,w:.8,h:.85},{t:'chair',x:cx+.65,y:cy-.42,w:.8,h:.85}));
const B_RIGHT={t:'cart',x:24.1,y:11.15,w:1.8,h:.75},B_LEFT={t:'cart',x:1.1,y:11.15,w:1.8,h:.75},B_MID={t:'rope',x:8.05,y:12.25,w:8.9,h:.5};

const LAMPS=[];[2.5,6.5,10.5,14.5,18.5,22.5].forEach(x=>{LAMPS.push([x,5.1]);LAMPS.push([x,18.9])});
LAMPS.push([1.1,9.5],[1.1,14.5],[25.9,9.5],[25.9,14.5],[12.5,10.2],[8.6,12],[16.4,12],[20.5,9.7]);
const CHAND=[[10.7,10.1],[14.6,12.6],[12.5,5.9],[12.5,18.1],[4.5,5.9],[19.5,5.9],[4.5,18.1],[19.5,18.1]];
const CHAND_R=[[12.5,11],[12.5,5.9],[4.5,5.9],[19.5,5.9],[4.5,18.1],[19.5,18.1],[12.5,18.1]];
const LAMPS_L=[];[6,11,16,20].forEach(y=>LAMPS_L.push([1.1,y],[25.9,y]));LAMPS_L.push([13,3.2]);
const CHAND_L=[[12.5,6.4],[7.5,9.5],[17.5,9.5],[12.5,13],[7.5,16.5],[17.5,16.5],[12.5,19.5]];

// ================= LEVELS =================
function mkLevel(o){const L=Object.assign({cache:null,mini:null},o);
  L.t=(x,y)=>(y<0||y>=H||x<0||x>=W)?'#':L.map[y][x];

function wsRoom(){return{join:name=>new Promise((res,rej)=>{if(NO_SERVER){toast('Appen mangler serveradresse (config.js).');rej(new Error('noserver'));return}
  let ws=null,me=null,peers=new Map(),myP={},hs=[],dead=false,first=true,tries=0;
  const list=()=>{const a=[...peers.entries()].filter(([k])=>k!==me).map(([k,pr])=>({peer:k,sameTab:false,isMe:false,presence:pr||{}}));if(me)a.unshift({peer:me,sameTab:true,isMe:true,presence:myP});return a};
  const fire=()=>{const ps=list();for(const h of hs)try{h({peers:ps,joined:[],left:[],updated:[]})}catch(e){}};
  const api={peers:list,onPeers:h=>{hs.push(h);setTimeout(()=>h({peers:list(),joined:[],left:[],updated:[]}),0);return()=>{hs=hs.filter(x=>x!==h)}},
    presence:p=>{myP=p;if(ws&&ws.readyState===1){try{ws.send(JSON.stringify({t:'p',d:p}))}catch(e){}}return Promise.resolve()},
    leave:()=>{dead=true;try{ws&&ws.close()}catch(e){}return Promise.resolve()}};
  const deadline=Date.now()+80000;let warned=0;
  const open=()=>{ws=new WebSocket(WS_URL);
    const to=setTimeout(()=>{if(first){try{ws.close()}catch(e){}}},Math.max(1000,deadline-Date.now()));
    if(first&&!warned){warned=1;setTimeout(()=>{if(first)toast('Vekker serveren … det kan ta opptil ett minutt første gang.')},2500)}
    ws.onopen=()=>{tries=0;ws.send(JSON.stringify({t:'join',room:name,id:me||undefined}))};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.t==='hi'){me=m.id;peers=new Map(m.peers);peers.delete(me);if(first){first=false;clearTimeout(to);res(api)}fire();if(myP&&myP.nick)api.presence(myP)}
      else if(m.t==='d'){for(const[k,p]of m.u)if(k!==me)peers.set(k,p);for(const k of m.g)peers.delete(k)}
      else if(m.t==='full'){toast('Rommet er fullt')}};
    ws.onclose=()=>{clearTimeout(to);if(first){if(Date.now()<deadline-2500&&!dead){setTimeout(open,2000);return}first=false;rej(new Error('closed'));return}if(!dead&&tries<30){tries++;setTimeout(open,Math.min(4000,400*tries))}}};
  open()})}}

  if(online){const hb=$('host');if(hb){if(hb.disabled)return;hb.disabled=true;hb.textContent='KOBLER TIL …'}

let lobbySig='';

  <label class="chk" for="hp" style="flex-direction:row;font-family:var(--body);font-size:18px;color:var(--fg)"><input type="checkbox" id="hp"${hostPlays?' checked':''}> Jeg spiller selv</label>
  <label class="chk" for="vi" style="flex-direction:row;font-family:var(--body);font-size:18px;color:var(--fg)"><input type="checkbox" id="vi"${HS.intro?' checked':''}> Vis introfilm</label></div>
  <p class="note">${hostPlays?'Du er med i spillet.':'Storskjerm: du ser hele etasjen og topplisten, men spiller ikke.'}</p>
  <button class="btn" id="go">START RUNDE</button><button class="btn alt" id="hideL">SKJUL (gå rundt i lobbyen)</button></div>`;
  $('selT').onchange=e=>{HS.selT=e.target.value;renderHostLobby()};$('dur').onchange=e=>{HS.durSel=+e.target.value;renderHostLobby()};
  $('nb').onchange=e=>{HS.nbots=+e.target.value;renderHostLobby()};$('tn').onchange=e=>{HS.tourN=+e.target.value;if(HS.tourN>1&&!HS.selT)HS.selT='rot';HS.tour=null;renderHostLobby()};$('vi').onchange=e=>{HS.intro=e.target.checked;renderHostLobby()};$('hp').onchange=e=>{hostPlays=e.target.checked;spectator=!hostPlays;if(!hostPlays&&HS.selT===myPeer)HS.selT='';renderHostLobby()};
  $('go').onclick=()=>{blurAll();const pl2=gatherPlayers();if(!pl2.length&&HS.selT!=='botT'){toast('Trenger minst én spiller som kan være lærer');return}hostStart();overlay.hidden=true};
  $('hideL').onclick=()=>{overlay.hidden=true};

let endShown=-1;
function standingsHTML(tb,final){return`<ol class="board">${tb.slice(0,14).map((e,i)=>{const mv=e[4]<0?'<small>ny</small>':e[4]>i?`<small style="color:#62d48c">▲${e[4]-i}</small>`:e[4]<i?`<small style="color:#ff8a70">▼${i-e[4]}</small>`:'<small>–</small>';
  const medal=final&&i<3?['🥇','🥈','🥉'][i]+' ':'';return`<li class="${e[0]===myPeer?'me':''}"><span>${i+1}</span><span>${medal}${esc(e[1])}${e[5]?' <small>(lærer)</small>':''} ${final?'':mv}</span><span>${e[2]} <small>+${e[3]}</small></span></li>`}).join('')}</ol>`}
function showEnd(H){if(endShown===H.r)return;endShown=H.r;overlay.hidden=false;
  const st=students(H).slice().sort((a,b)=>b[2]-a[2]),tN=nameOf(H,H.T),caught=st.filter(s=>isOut(H,s[0])).length,me=st.findIndex(s=>s[0]===myPeer);

  ${T?`<div class="tabs"><button class="tab on" id="tabTot">${fin?'RESULTAT':'SAMMENLAGT'}</button><button class="tab" id="tabRnd">DENNE RUNDEN</button></div><div id="endBody">${standingsHTML(T.tb,fin)}</div>`
   :`<ol class="board">${st.slice(0,12).map((s,i)=>`<li class="${s[0]===myPeer?'me':''}"><span>${i+1}</span><span>${esc(s[1])}${isOut(H,s[0])?' <small>tatt</small>':' <small>klarte seg</small>'}</span><span>${s[2]}</span></li>`).join('')}</ol>`}

   :`<p class="note">${T&&!fin?`Venter på at verten starter runde ${T.c+1}…`:'Venter på verten…'}</p><button class="btn alt" id="quit">TILBAKE TIL STARTSIDEN</button>`}</div>`;

    $('tabRnd').onclick=()=>{$('endBody').innerHTML=`<ol class="board">${roundTb.slice(0,14).map((e,i)=>`<li class="${e[0]===myPeer?'me':''}"><span>${i+1}</span><span>${esc(e[1])}${e[5]?' <small>(lærer)</small>':isOut(H,e[0])?' <small>tatt</small>':''}</span><span>${e[2]}</span></li>`).join('')}</ol>`;$('tabRnd').classList.add('on');$('tabTot').classList.remove('on')}}
  const toLobby=()=>{HS.ph='lobby';HS.out={};HS.items=[];HS.bots=[];HS.T=null;HS.pub=buildPub();ui='lobby';showHostLobby();spawnSelf({ph:'lobby'})};
  if($('again'))$('again').onclick=()=>{if(T&&!fin){HS.out={};HS.items=[];HS.bots=[];hostStart();overlay.hidden=true;ui='play'}else{HS.tour=null;HS.rotDone=[];if(T){HS.out={};HS.items=[];HS.bots=[];hostStart();overlay.hidden=true;ui='play'}else toLobby()}};
  if($('lob'))$('lob').onclick=()=>{HS.tour=null;HS.rotDone=[];toLobby()};
  $('quit').onclick=()=>{if(nroom)nroom.leave().catch(()=>{});nroom=null;isHost=false;HS=null;code='';spectator=false;hostPlays=true;roundSeen=-1;seenEv=-1;showIntro()};
}
function syncUI(H){
  if(ui==='intro')return;
  if(H&&H.ph==='intro'){if(isHost&&ui==='lobby')ui='play';overlay.hidden=true;endShown=-1;if(introSkip===H.r&&timeLeft(H)>3.2){banner.hidden=false;banner.innerHTML=`<span>Venter på at alle hopper over filmen (<b>${num(H.skN)}/${num(H.toN)}</b>)… ellers starter spillet om <b>${Math.ceil(timeLeft(H))}</b> sek.</span>`}else banner.hidden=true;return}
  if(!H){banner.hidden=false;banner.innerHTML=hostMissing>6?`<span>Fant ikke spillet med kode <b>${esc(code)}</b>. Er verten fortsatt der?</span><button id="bk">TILBAKE</button>`:`<span>Kobler til spill <b>${esc(code)}</b>…</span>`;
    const bk=$('bk');if(bk)bk.onclick=()=>{if(nroom)nroom.leave().catch(()=>{});nroom=null;showIntro()};return}
  if(H.ph==='lobby'){if(isHost){if(!overlay.hidden)renderHostLobby();banner.hidden=!overlay.hidden;if(!banner.hidden){banner.innerHTML=`<span>Kode <b>${esc(code||'–')}</b> · ${(H.lob||[]).length} spillere</span><button id="sl">VIS LOBBY</button>`;$('sl').onclick=()=>{banner.hidden=true;showHostLobby()}}}
    else{overlay.hidden=true;banner.hidden=false;banner.innerHTML=`<span>Venter på at verten starter… Kode <b>${esc(code)}</b> · ${(H.lob||[]).length} spillere. Gå rundt og bli kjent med hotellet!</span>`}endShown=-1;return}
  if(H.ph==='play'){if(isHost&&ui==='lobby'){ui='play'}overlay.hidden=true;const out=isOut(H,myPeer);
    const camp=H.camp||[];
    if(spectator){banner.hidden=false;banner.innerHTML=`<span>STORSKJERM${camp.length?` · <b>Romservice:</b> ${camp.map(id=>esc(nameOf(H,id))).join(', ')} gjemmer seg`:''}</span>`}
    else if(out){banner.hidden=false;banner.innerHTML=`<span><b>Du er ute!</b> Du følger læreren. Poengene dine står på listen.</span>`}
    else if(myRole(H)==='s'&&camp.includes(myPeer)){banner.hidden=false;banner.innerHTML=`<span><b>Romservice banker på!</b> Læreren ser deg på kartet, og du får ikke tidspoeng. Kom deg ut!</span>`}
    else if(myRole(H)==='t'&&camp.length){banner.hidden=false;banner.innerHTML=`<span><b>Romservice:</b> ${camp.map(id=>esc(nameOf(H,id))).join(', ')} gjemmer seg på rom. Se lilla prikk på kartet!</span>`}

    else{banner.hidden=false;banner.innerHTML=num(H.ammo)>0?`<span>Du har <b>nerfgun</b>. Sikt med retningen du går, trykk SKYT.</span>`:`<span>Ta elevene! Finn en <b>nerfgun</b> (oransje pil).</span>`}
    return}
  if(H.ph==='end'){banner.hidden=true;showEnd(H)}
}

const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
const typing=e=>{const tg=e.target&&e.target.tagName;return(tg==='INPUT'||tg==='SELECT')&&!overlay.hidden};
addEventListener('keydown',e=>{if(typing(e))return;if(KEYS[e.key]){keys.add(KEYS[e.key]);e.preventDefault();blurAll()}
  else if(e.key===' '){e.preventDefault();blurAll();if(!e.repeat)spaceAct()}else if(e.key==='e'||e.key==='E')useItem();else if(e.key==='q'||e.key==='Q'||e.key==='Shift')useDrink();},true);
function blurAll(){const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur()}
function spaceAct(){const H=hostState();if(!H||H.ph!=='play')return;const sl=slotOf(H);
  if(myRole(H)==='t'){const pending=myShots.filter(q=>q.i>num(H.ls)).length;if(num(H.ammo)-pending>0)shoot();else if(sl)useItem();else shoot()}
  else{if(sl)useItem();else useDrink()}}
addEventListener('keyup',e=>{if(KEYS[e.key])keys.delete(KEYS[e.key]);if(e.key===' ')e.preventDefault()},true);
const skipBtn=$('skip'),spb=$('sprint');function skipIntro(){const H=hostState();if(H&&H.ph==='intro'){introSkip=H.r;skipBtn.hidden=true}}
skipBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();skipIntro()});skipBtn.addEventListener('click',skipIntro);
stage.addEventListener('pointerdown',skipIntro);$('floors').addEventListener('pointerdown',skipIntro);
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Enter')skipIntro()});
function bindStick(el,knob,floating){let id=null,ox=0,oy=0;const R=()=>floating?44:el.clientWidth*.36;
  el.addEventListener('pointerdown',e=>{if(floating&&(e.target!==cv||ui==='intro'))return;e.preventDefault();id=e.pointerId;el.setPointerCapture(id);
    if(floating){const r=stage.getBoundingClientRect();ox=e.clientX;oy=e.clientY;const fs=$('fstick');fs.hidden=false;fs.style.left=(e.clientX-r.left)+'px';fs.style.top=(e.clientY-r.top)+'px'}
    else{const r=el.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2;move(e)}joy.active=true});
  const move=e=>{if(e.pointerId!==id)return;let dx=e.clientX-ox,dy=e.clientY-oy;const m=Math.hypot(dx,dy),rr=R();if(m>rr){dx*=rr/m;dy*=rr/m}joy.x=dx/rr;joy.y=dy/rr;knob.style.transform=`translate(${dx}px,${dy}px)`};
  el.addEventListener('pointermove',move);const up=e=>{if(e.pointerId!==id)return;id=null;joy.active=false;joy.x=joy.y=0;knob.style.transform='';if(floating)$('fstick').hidden=true};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
bindStick($('stick'),$('knob'),false);bindStick(stage,document.querySelector('#fstick i'),true);
spb.addEventListener('pointerdown',e=>{e.preventDefault();useItem()});

{const bn=$('banner'),d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');Object.defineProperty(bn,'innerHTML',{get(){return d.get.call(this)},set(v){if(this.__h===v)return;this.__h=v;d.set.call(this,v)}})}
function hostToLobby(){if(!HS)return;HS.tour=null;HS.rotDone=[];HS.ph='lobby';HS.out={};HS.items=[];HS.bots=[];HS.T=null;HS.forceEnd=0;HS.pub=buildPub();ui='lobby';closeMenu();showHostLobby();spawnSelf({ph:'lobby'})}

let menuBox=null;function closeMenu(){if(menuBox)menuBox.hidden=true}

  menuBox.hidden=false;document.getElementById('sMute').onclick=()=>{audioOn();setMuted(!muted)};document.getElementById('sClose').onclick=closeMenu}
$('menu').onclick=openMenu;
const hudEl=document.querySelector('.hud'),deckEl=document.querySelector('.deck');setInterval(()=>{$('menu').hidden=ui==='intro';document.body.classList.toggle('intro',ui==='intro')},150);document.body.classList.toggle('intro',ui==='intro');

function fit(){const r=stage.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d))}

  else{cam.x=12.5+Math.sin(n/4000)*6;cam.y=12+Math.cos(n/5000)*5}
  render(n/1000,dt);drawDark();drawBig();drawLetter();introOverlay();requestAnimationFrame(loop)}
$('whistle').hidden=true;showIntro();requestAnimationFrame(loop);
